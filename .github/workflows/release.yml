name: build-and-publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: build_wheels_${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            cibw_arch: x86_64
            cibw_skip: "pp* *-manylinux_i686 *-musllinux_*"
          - name: windows-x64
            runner: windows-latest
            cibw_arch: AMD64
            cibw_skip: "pp* *-win32"
          - name: macos-arm64
            runner: macos-14
            cibw_arch: arm64
            cibw_skip: "pp*"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 uv 并准备宿主 Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 构建 wheel
        env:
          # 这里的宿主 Python 只用于运行 cibuildwheel 工具本身。
          # 实际要验证的目标 wheel 版本仍然由 CIBW_BUILD 控制。
          # 先只验证 cp310，确认三平台主链稳定后再放开到 3.11+。
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "${{ matrix.cibw_skip }}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ARCHS: "${{ matrix.cibw_arch }}"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BEFORE_ALL_LINUX: >-
            sh -c "if command -v dnf >/dev/null 2>&1; then dnf install -y pkgconfig libvorbis-devel; else yum install -y pkgconfig libvorbis-devel; fi"
          CIBW_BEFORE_ALL_MACOS: >-
            brew install pkg-config libvorbis
        run: uvx cibuildwheel --output-dir dist

      - name: 上传 wheel 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  build_sdist:
    name: build_sdist
    runs-on: ubuntu-latest
    needs:
      - build_wheels

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 uv 并准备宿主 Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 构建 sdist
        run: uv build --sdist

      - name: 上传 sdist 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: publish_pypi
    runs-on: ubuntu-latest
    needs:
      - build_wheels
      - build_sdist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pyvgmstream

    steps:
      - name: 下载所有发布产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      # 注意：
      # 这个 job 假定仓库和 PyPI 之间已经配置好 Trusted Publishing。
      # 在 PyPI 侧没有完成发布者绑定之前，tag 触发到这里也不会真正完成发布。
