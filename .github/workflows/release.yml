name: build-and-publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare_release:
    name: prepare_release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release_mode.outputs.should_publish }}
      tag_name: ${{ steps.release_mode.outputs.tag_name }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 判断发布模式
        id: release_mode
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 来自 main
        if: steps.release_mode.outputs.should_publish == 'true'
        shell: bash
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build_wheels:
    name: build_wheels_${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            cibw_arch: x86_64
            cibw_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
            cibw_skip: "*-manylinux_i686 *-musllinux_*"
          - name: windows-x64-py310
            runner: windows-latest
            cibw_arch: AMD64
            cibw_build: "cp310-win_amd64"
            cibw_skip: "*-win32"
          - name: windows-x64-py311
            runner: windows-latest
            cibw_arch: AMD64
            cibw_build: "cp311-win_amd64"
            cibw_skip: "*-win32"
          - name: windows-x64-py312
            runner: windows-latest
            cibw_arch: AMD64
            cibw_build: "cp312-win_amd64"
            cibw_skip: "*-win32"
          - name: windows-x64-py313
            runner: windows-latest
            cibw_arch: AMD64
            cibw_build: "cp313-win_amd64"
            cibw_skip: "*-win32"
          - name: windows-x64-py314
            runner: windows-latest
            cibw_arch: AMD64
            cibw_build: "cp314-win_amd64"
            cibw_skip: "*-win32"
          - name: macos-arm64
            runner: macos-14
            cibw_arch: arm64
            cibw_build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
            cibw_skip: ""

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 准备宿主 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装构建工具
        run: python -m pip install --upgrade pip cibuildwheel

      - name: 构建 wheel
        env:
          # 发布前执行三平台全版本回归；Windows 按 Python 版本拆分为独立 job。
          CIBW_BUILD: "${{ matrix.cibw_build }}"
          CIBW_SKIP: "${{ matrix.cibw_skip }}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ARCHS: "${{ matrix.cibw_arch }}"
          CIBW_BEFORE_ALL_LINUX: >-
            sh -c "if command -v dnf >/dev/null 2>&1; then dnf install -y pkgconfig libvorbis-devel; else yum install -y pkgconfig libvorbis-devel; fi"
          CIBW_BEFORE_ALL_MACOS: >-
            brew install pkg-config libvorbis
        run: python -m cibuildwheel --output-dir dist

      - name: 上传 wheel 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  build_sdist:
    name: build_sdist
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - build_wheels

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 准备宿主 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装构建工具
        run: python -m pip install --upgrade pip build

      - name: 构建 sdist
        run: python -m build --sdist

      - name: 上传 sdist 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  create_release:
    name: create_release
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - build_wheels
      - build_sdist
    if: needs.prepare_release.outputs.should_publish == 'true'
    permissions:
      contents: write

    steps:
      - name: 下载所有发布产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ needs.prepare_release.outputs.tag_name }}"
          dist/*
          --repo "${{ github.repository }}"
          --generate-notes

  publish_pypi:
    name: publish_pypi
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - create_release
    if: needs.prepare_release.outputs.should_publish == 'true'
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pyvgmstream

    steps:
      - name: 下载所有发布产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      # 注意：
      # 这个 job 假定仓库和 PyPI 之间已经配置好 Trusted Publishing。
      # 在 PyPI 侧没有完成发布者绑定之前，tag 触发到这里也不会真正完成发布。
