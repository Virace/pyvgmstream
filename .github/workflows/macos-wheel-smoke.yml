name: macos-wheel-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_macos_wheel:
    name: build_macos_wheel
    runs-on: macos-14

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 准备宿主 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装构建工具
        run: python -m pip install --upgrade pip cibuildwheel

      - name: 构建 macOS arm64 wheel
        env:
          CIBW_BUILD: "cp310-macosx_arm64"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ARCHS: "arm64"
          CIBW_BEFORE_ALL_MACOS: >-
            brew install pkg-config libvorbis
        run: python -m cibuildwheel --output-dir dist

      - name: 上传 wheel 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64-smoke
          path: dist/*.whl
