[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyvgmstream"
version = "0.1.0"
description = "WEM-first Python package shell for vgmstream public API bindings."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES/*",
    "vendor/vgmstream/COPYING",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "sounddevice>=0.5",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.temp/pytest-tmp"
cache_dir = ".temp/.pytest_cache"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["src/pyvgmstream"]
